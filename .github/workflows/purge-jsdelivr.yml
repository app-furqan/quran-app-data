name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main
    paths:
      - 'data/**.tar.xz'

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr CDN cache for all tar.xz files
        run: |
          REPO="app-furqan/quran-app-data"
          BRANCH="main"
          BASE_URL="https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}"

          FILES=(
            "data/ar-tafsir-al-tabari.db.tar.xz"
            "data/irab_al_karbasi.tar.xz"
            "data/lexicon.sqlite.tar.xz"
            "data/muyassar.db.tar.xz"
            "data/quran_svg.db.tar.xz"
            "data/tafsir_almizan_ar.db.tar.xz"
            "data/tafsir_almizan_en.db.tar.xz"
            "data/tafsir_almizan_fa.db.tar.xz"
            "data/tafsir_almizan_ur.db.tar.xz"
            "data/tafsir_nemouneh_fa_en_ur.tar.xz"
            "data/tafsir-noor.tar.xz"
            "data/tafsir_safi_ar_en_ur.db.tar.xz"
          )

          for FILE in "${FILES[@]}"; do
            URL="${BASE_URL}/${FILE}"
            echo "Purging: $URL"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "  -> HTTP $HTTP_STATUS"
          done
