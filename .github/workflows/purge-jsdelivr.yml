name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main
    paths:
      - 'data/**.tar.xz'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Purge jsDelivr CDN cache for all tar.xz files
        run: |
          REPO="app-furqan/quran-app-data"
          BRANCH="main"
          BASE_URL="https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}"

          # Discover every tar.xz file under data/ so new files are purged automatically.
          mapfile -t FILES < <(find data -type f -name '*.tar.xz' | sort)

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No tar.xz files found under data/"
            exit 0
          fi

          for FILE in "${FILES[@]}"; do
            URL="${BASE_URL}/${FILE}"
            echo "Purging: $URL"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "  -> HTTP $HTTP_STATUS"
          done
